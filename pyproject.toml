[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuisnappman"
version = "0.1.0"
description = "TUI para gestionar snapshots de Snapper y encontrar qué ocupa espacio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["textual>=6"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "textual-dev"]

[project.scripts]
tuisnappman = "tuisnappman.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tuisnappman = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["RUF012"]  # BINDINGS de Textual es una lista mutable por diseño
